spring:
  application:
    name: kontroller

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  lifecycle:
    timeout-per-shutdown-phase: 30s

application:
  time-zone: ${APP_TIME_ZONE:Europe/Warsaw}

server:
  shutdown: graceful
  error:
    include-stacktrace: never

loss:
  fixed:
    min-gap: 1m
