spring:
  application:
    name: kontroller

  datasource:
    url: jdbc:postgresql://localhost:5432/shiftcounter
    username: shift
    password: shift

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  error:
    include-stacktrace: always

loss:
  fixed:
    min-gap: 1m
