spring:
  application:
    name: kontroller

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  error:
    include-stacktrace: always

loss:
  fixed:
    min-gap: 1m
