<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Settings Page</title>
    <style>
        body {
            font-family: sans-serif;
        }

        input[type="text"], input[type="number"] {
            width: 100px;
            padding: 5px;
            margin: 2px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-shadow: none;
            background-color: white;
        }

        button {
            font-size: 14px;
            padding: 5px 10px;
            margin: 4px 2px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .delete-button {
            background: none;
            color: red;
            font-size: 20px;
            border: none;
            padding: 0;
            margin: 0;
            cursor: pointer;
        }

        .delete-button:hover {
            background: none;
        }

        .delete-button:focus {
            outline: none;
        }

        table {
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div th:fragment="content">
    <div style="max-width: 800px; margin: auto;">
        <h1>Settings Page</h1>

        <form th:action="@{/settings}" method="post">
            <label for="ppm">Line Speed (PPM):</label>
            <input id="ppm" name="ppm" type="text" th:value="${ppm}" />
            <!--
            <label for="pouchesPerCan">Pouches per Can:</label>
            <input id="pouchesPerCan" name="pouchesPerCan" type="text" th:value="${pouchesPerCan}" />
            -->
            <table>
                <thead>
                <tr>
                    <th>Hour</th>
                    <th>Plan (Cans)</th>
                    <th></th>
                </tr>
                </thead>
                <tbody id="hourTable">
                <tr th:each="hour, i : ${hours}">
                    <td>
                        <input name="hours" type="text" th:value="${hour}" />
                    </td>
                    <td>
                        <input name="plans" type="text" th:value="${plans[i.index]}" />
                    </td>
                    <td>
                        <button type="button" class="delete-button" onclick="removeRow(this)">×</button>
                    </td>
                </tr>
                </tbody>
            </table>

            <br/>
            <button type="button" onclick="addRow()">Add Hour</button>
            <button type="submit">Save</button>
        </form>
    </div>

    <script>
        function removeRow(button) {
            const row = button.closest("tr");
            row.remove();
        }

        function addRow() {
            const table = document.getElementById("hourTable");
            const row = document.createElement("tr");

            row.innerHTML = `
                <td><input name="hours" type="text" value="" /></td>
                <td><input name="plans" type="text" value="140" /></td>
                <td><button type="button" class="delete-button" onclick="removeRow(this)">×</button></td>
            `;

            table.appendChild(row);
        }
    </script>
</div>
</body>
</html>
