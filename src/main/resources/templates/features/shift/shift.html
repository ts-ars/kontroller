<div th:fragment="content" id="plan-fact-page" class="feature-page">
    <style>
        #plan-fact-page h1 { margin-top: 0; }
        #plan-fact-page .view-switches { display: flex; flex-wrap: wrap; gap: .5rem 2rem; margin-bottom: .5rem; }
        #plan-fact-page .view-switches a { color: #000; text-decoration: none; }
        #plan-fact-page .view-switches a.active { color: #1d4ed8; text-decoration: underline; }
        #plan-fact-page .sensor-panel { width: 100%; max-width: 800px; min-width: 0; }
        #plan-fact-page .sensor-panel:nth-child(even) { justify-self: end; }
        #plan-fact-page .sensor-panel h2 { margin: .5em 0; }
        #plan-fact-page .chart-frame { width: 600px; max-width: 100%; height: 190px; margin: 0 auto; }
        #plan-fact-page table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-top: .5rem; }
        #plan-fact-page th, #plan-fact-page td { padding: .3rem 1rem; border: 1px solid #ccc; text-align: center; }
        #plan-fact-page th:nth-child(-n+3), #plan-fact-page td:nth-child(-n+3) { width: 88px; vertical-align: middle; }
        #plan-fact-page td.comment-cell { text-align: left; vertical-align: top; }
        #plan-fact-page .comment-line + .comment-line { margin-top: .25rem; }
        @container (max-width: 1100px) {
            #plan-fact-page .sensor-panel, #plan-fact-page .sensor-panel:nth-child(even) { justify-self: center; }
        }
        @media (max-width: 700px) {
            #plan-fact-page .view-switches { gap: .5rem 1rem; }
            #plan-fact-page .chart-frame { width: 100%; height: 180px; }
            #plan-fact-page table { table-layout: fixed; }
            #plan-fact-page th, #plan-fact-page td { min-width: 0; padding: .3rem clamp(.2rem, 1.4vw, .5rem); }
            #plan-fact-page th:nth-child(1), #plan-fact-page td:nth-child(1) { width: 14%; }
            #plan-fact-page th:nth-child(2), #plan-fact-page td:nth-child(2) { width: 17%; }
            #plan-fact-page th:nth-child(3), #plan-fact-page td:nth-child(3) { width: 17%; }
            #plan-fact-page th:nth-child(4), #plan-fact-page td:nth-child(4) { width: 52%; }
            #plan-fact-page td.comment-cell { overflow-wrap: anywhere; word-break: normal; }
        }
    </style>

    <h1>Plan–Fact</h1>
    <div class="view-switches">
        <div aria-label="Sensor range">
            <a th:href="@{/page/shift(sensors='1-4',shift=${shiftSlice})}" th:classappend="${sensorGroup == '1-4'} ? 'active'">1–4</a>
            <span aria-hidden="true"> | </span>
            <a th:href="@{/page/shift(sensors='5-6',shift=${shiftSlice})}" th:classappend="${sensorGroup == '5-6'} ? 'active'">5–6</a>
        </div>
        <div aria-label="Production shift">
            <span>Shift: </span>
            <a th:href="@{/page/shift(sensors=${sensorGroup},shift='day')}" th:classappend="${shiftSlice == 'day'} ? 'active'">07:00–15:00</a>
            <span aria-hidden="true"> | </span>
            <a th:href="@{/page/shift(sensors=${sensorGroup},shift='evening')}" th:classappend="${shiftSlice == 'evening'} ? 'active'">15:00–23:00</a>
        </div>
    </div>

    <div class="sensor-grid adaptive-two-column-grid">
        <section class="sensor-panel" th:each="view : ${views}" th:attr="data-sensor=${view.sensorId}">
            <h2 th:text="${#strings.replace(view.sensorId, 'sensor-', 'Sensor ')}">Sensor 1</h2>
            <div class="chart-frame"><canvas height="190" th:attr="aria-label=|${view.sensorId} cans chart|"></canvas></div>
            <strong class="chart-total" th:text="|Total production: ${view.totalActual}|">Total production: 0</strong>
            <table th:attr="aria-label=|${view.sensorId} Plan–Fact|">
                <thead><tr><th>Time</th><th>Plan</th><th>Actual</th><th>Comment</th></tr></thead>
                <tbody>
                <tr th:each="hour, i : ${view.hours}">
                    <td th:text="${hour}">07:00</td>
                    <td th:text="${view.planSupplied[i.index] ? view.plan[i.index] : 'Plan required'}">450</td>
                    <td th:text="${view.actual[i.index]}">0</td>
                    <td class="comment-cell">
                        <div class="comment-line" th:each="explanation : ${view.explanations[i.index]}"
                             th:classappend="${explanation.status != 'EXPLAINED'} ? ' loss-alert'"
                             th:text="${(view.sensorId == 'sensor-5' ? #strings.replace(explanation.sourceSensorId, 'sensor-', 'Sensor ') + ': ' : '')
                                + explanation.comment + ' — ' + explanation.minutes + ' min / ' + explanation.cans + ' cans'}"></div>
                    </td>
                </tr>
                </tbody>
                <tfoot><tr><th>Total</th><th class="plan-total" th:text="${view.totalPlan}">0</th><th class="actual-total" th:text="${view.totalActual}">0</th><th></th></tr></tfoot>
            </table>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="/vendor/sockjs.min.js"></script>
    <script src="/vendor/stomp.min.js"></script>
    <script th:inline="javascript">
        (() => {
            const views = /*[[${views}]]*/ [];
            const charts = new Map();
            const positiveValueLabels = {id:'positiveValueLabels',afterDatasetsDraw(chart){const {ctx}=chart;ctx.save();ctx.font='bold 12px Arial';ctx.fillStyle='#111';ctx.textAlign='center';chart.getDatasetMeta(0).data.forEach((bar,index)=>{const value=Number(chart.data.datasets[0].data[index]||0);if(value>0)ctx.fillText(value.toLocaleString(),bar.x,bar.y-5);});ctx.restore();}};
            document.querySelectorAll('#plan-fact-page .sensor-panel').forEach(panel => {
                const view = views.find(item => item.sensorId === panel.dataset.sensor);
                if (!view || !window.Chart) return;
                const chart = new Chart(panel.querySelector('canvas'), {
                    type: 'bar',
                    data: {labels: view.hours, datasets: [{label: 'Cans', data: view.actual, backgroundColor: '#3b82f6'}]},
                    options: {responsive: true, maintainAspectRatio: false, layout:{padding:{top:16}},
                        plugins: {legend: {display: true, position: 'top'}, tooltip: {enabled: true}},
                        scales: {x: {title: {display: true, text: 'Time'}},
                            y: {title: {display: true, text: 'Cans'}, beginAtZero: true,
                                suggestedMax: 100, ticks: {stepSize: 20, maxTicksLimit: 10}}}},
                    plugins: [positiveValueLabels]
                });
                charts.set(view.sensorId, chart);
            });

            const renderExplanations = (cell, explanations, sensorId) => {
                cell.replaceChildren(...explanations.map(explanation => {
                    const line = document.createElement('div');
                    line.className = `comment-line ${explanation.status !== 'EXPLAINED' ? 'loss-alert' : ''}`;
                    const source = sensorId === 'sensor-5'
                        ? `${explanation.sourceSensorId.replace('sensor-', 'Sensor ')}: ` : '';
                    line.textContent = `${source}${explanation.comment} — ${explanation.minutes} min / ${explanation.cans || 0} cans`;
                    return line;
                }));
            };
            const updatePanel = nextView => {
                const panel = document.querySelector(`#plan-fact-page .sensor-panel[data-sensor="${nextView.sensorId}"]`);
                const currentView = views.find(item => item.sensorId === nextView.sensorId);
                if (!panel || !currentView) return;
                const rows = panel.querySelectorAll('tbody tr');
                const nextIndexByHour = new Map(nextView.hours.map((hour, index) => [hour, index]));
                const visibleActual = [];
                rows.forEach(row => {
                    const index = nextIndexByHour.get(row.cells[0].textContent.trim());
                    if (index === undefined) return;
                    row.cells[1].textContent = nextView.planSupplied[index] ? nextView.plan[index] : 'Plan required';
                    row.cells[2].textContent = nextView.actual[index];
                    visibleActual.push(nextView.actual[index]);
                    renderExplanations(row.querySelector('.comment-cell'), nextView.explanations[index], nextView.sensorId);
                });
                const actualTotal = visibleActual.reduce((sum, value) => sum + Number(value || 0), 0);
                panel.querySelector('.actual-total').textContent = actualTotal;
                panel.querySelector('.plan-total').textContent = Array.from(rows).reduce((sum, row) => sum + (Number(row.cells[1].textContent.trim()) || 0), 0);
                panel.querySelector('.chart-total').textContent = `Total production: ${actualTotal}`;
                const chart = charts.get(nextView.sensorId);
                const currentActual = chart?.data.datasets[0].data || [];
                const actualChanged = currentActual.length !== visibleActual.length
                    || currentActual.some((value, index) => Number(value) !== Number(visibleActual[index]));
                if (chart && actualChanged) {
                    chart.data.datasets[0].data = visibleActual;
                    chart.update('none');
                }
                currentView.actual = visibleActual.slice();
            };
            const refreshComments = async sensorId => {
                const response = await fetch(window.location.href, {headers: {'X-Requested-With': 'XMLHttpRequest'}});
                if (!response.ok) return;
                const documentCopy = new DOMParser().parseFromString(await response.text(), 'text/html');
                const current = document.querySelector(`#plan-fact-page .sensor-panel[data-sensor="${sensorId}"] tbody`);
                const fresh = documentCopy.querySelector(`#plan-fact-page .sensor-panel[data-sensor="${sensorId}"] tbody`);
                if (!current || !fresh || current.rows.length !== fresh.rows.length) return;
                Array.from(current.rows).forEach((row, index) => {
                    row.querySelector('.comment-cell').replaceWith(fresh.rows[index].querySelector('.comment-cell'));
                });
            };

            const syncVisiblePanels = async () => {
                const response = await fetch(window.location.href, {
                    cache: 'no-store',
                    headers: {'X-Requested-With': 'XMLHttpRequest'}
                });
                if (!response.ok) return;
                const freshDocument = new DOMParser().parseFromString(await response.text(), 'text/html');
                document.querySelectorAll('#plan-fact-page .sensor-panel').forEach(panel => {
                    const freshPanel = freshDocument.querySelector(
                        `#plan-fact-page .sensor-panel[data-sensor="${panel.dataset.sensor}"]`
                    );
                    if (!freshPanel) return;
                    const rows = panel.querySelectorAll('tbody tr');
                    const freshRows = freshPanel.querySelectorAll('tbody tr');
                    if (rows.length !== freshRows.length) return;
                    const actual = [];
                    rows.forEach((row, index) => {
                        row.cells[1].textContent = freshRows[index].cells[1].textContent;
                        row.cells[2].textContent = freshRows[index].cells[2].textContent;
                        row.querySelector('.comment-cell').replaceWith(
                            freshRows[index].querySelector('.comment-cell')
                        );
                        actual.push(Number(freshRows[index].cells[2].textContent.trim()) || 0);
                    });
                    panel.querySelector('tfoot').replaceWith(freshPanel.querySelector('tfoot'));
                    panel.querySelector('.chart-total').replaceWith(freshPanel.querySelector('.chart-total'));
                    const chart = charts.get(panel.dataset.sensor);
                    if (chart) {
                        chart.data.datasets[0].data = actual;
                        chart.update('none');
                    }
                });
            };

            if (!window.SockJS || !window.Stomp) return;
            let client;
            let socket;
            let reconnectTimer;
            let reconnecting = false;
            const reconnect = () => {
                clearTimeout(reconnectTimer);
                reconnectTimer = setTimeout(connect, 2000);
            };
            const disconnectAndReconnect = () => {
                if (reconnecting) return;
                reconnecting = true;
                clearTimeout(reconnectTimer);
                try {
                    if (client?.connected) client.disconnect(() => {});
                    else socket?.close();
                } catch (_) {}
                client = undefined;
                socket = undefined;
                setTimeout(() => {
                    reconnecting = false;
                    connect();
                }, 100);
            };
            const connect = () => {
                if (document.visibilityState === 'hidden' || client?.connected) return;
                socket = new SockJS('/ws');
                client = Stomp.over(socket);
                client.debug = () => {};
                client.heartbeat.outgoing = 10000;
                client.heartbeat.incoming = 10000;
                client.connect({}, async () => {
                    views.forEach(view => {
                        client.subscribe(`/topic/shift-updates/${view.sensorId}`, message => updatePanel(JSON.parse(message.body)));
                        client.subscribe(`/topic/comments/${view.sensorId}`, () => refreshComments(view.sensorId));
                    });
                    await syncVisiblePanels();
                }, reconnect);
            };
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') disconnectAndReconnect();
            });
            window.addEventListener('pageshow', event => {
                if (event.persisted || !client?.connected) disconnectAndReconnect();
            });
            window.addEventListener('online', disconnectAndReconnect);
            window.addEventListener('beforeunload', () => {
                clearTimeout(reconnectTimer);
                try { socket?.close(); } catch (_) {}
            }, {once: true});
            connect();
        })();
    </script>
</div>
