<div th:fragment="content" class="report-page">
    <h1>Shift Report</h1>
    <nav class="report-sensors" aria-label="Sensor">
        <th:block th:each="sensor, iteration : ${sensorOptions}">
            <a th:href="@{/page/report(from=${startDate},to=${endDate},sensorId=${sensor.id.value})}" th:classappend="${sensor.id.value == sensorId} ? 'active'" th:text="${#strings.substringAfter(sensor.id.value, 'sensor-')}">1</a><span th:if="${!iteration.last}" aria-hidden="true"> | </span>
        </th:block>
    </nav>
    <form method="get" class="report-filters">
        <label>From <input type="date" name="from" th:value="${startDate}" /></label>
        <label>To <input type="date" name="to" th:value="${endDate}" /></label>
        <input type="hidden" name="sensorId" th:value="${sensorId}" />
        <button type="submit">Filter</button><button type="submit" formaction="/report/export.xlsx">Export Excel</button>
    </form>
    <div class="report-table-wrap"><table th:class="'report-table ' + (${sensorId == 'sensor-5'} ? 'report-table--with-source ' : 'report-table--without-source ') + (${canExclude} ? 'report-table--with-actions' : 'report-table--without-actions')">
        <colgroup><col th:if="${sensorId == 'sensor-5'}" class="report-source-column" /><col class="report-type-column" /><col class="report-number-column" /><col class="report-number-column" /><col class="report-reason-column" /><col class="report-author-column" /><col th:if="${canExclude}" class="report-actions-column" /></colgroup>
        <thead><tr><th th:if="${sensorId == 'sensor-5'}">Source</th><th>Type</th><th>Minutes</th><th>Cans</th><th>Reason</th><th>Author</th><th th:if="${canExclude}">Actions</th></tr></thead>
        <tbody>
        <tr th:each="problem : ${problems}"><td th:if="${sensorId == 'sensor-5'}" th:text="${problem.source}"></td><td th:text="${problem.type}"></td><td th:text="${problem.minutes}"></td><td th:text="${problem.cans}"></td><td class="report-reason" th:text="${problem.reason}"></td><td class="report-author" th:text="${problem.author}"></td><td th:if="${canExclude}"><button th:if="${problem.stoppageId != null}" type="button" th:attr="data-id=${problem.stoppageId}" onclick="excludeReportRow(this)">Delete</button></td></tr>
        <tr th:if="${problems.isEmpty()}"><td th:colspan="${(sensorId == 'sensor-5' ? 6 : 5) + (canExclude ? 1 : 0)}" class="report-empty">No data for selected range</td></tr>
        </tbody>
        <tfoot><tr><th th:if="${sensorId == 'sensor-5'}"></th><th>Total</th><th th:text="${totalMinutes}"></th><th th:text="${totalCans}"></th><th></th><th></th><th th:if="${canExclude}"></th></tr></tfoot>
    </table></div>
    <dialog id="report-delete-dialog" class="report-delete-dialog" aria-labelledby="report-delete-title">
        <h2 id="report-delete-title">Delete report row?</h2>
        <p>Enter a reason before deleting this row.</p>
        <label>Reason for deletion <input id="report-delete-reason" type="text" value="Not relevant" autocomplete="off" /></label>
        <div id="report-delete-error" class="report-delete-error" aria-live="polite"></div>
        <div class="report-delete-actions"><button type="button" onclick="closeReportDeleteDialog()">Cancel</button><button id="report-delete-confirm" type="button" onclick="confirmReportRowDeletion()">Delete</button></div>
    </dialog>
    <div class="report-charts"><section class="report-chart-card"><canvas id="lossChart"></canvas></section><section class="report-chart-card"><canvas id="cansChart"></canvas></section></div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script th:inline="javascript">
        const reportRows = /*[[${problems}]]*/ [], reportLossTotals = /*[[${lossTotals}]]*/ [], reportTimeTotals = /*[[${timeTotals}]]*/ [];
        let reportDeleteButton = null;
        function excludeReportRow(button) {
            reportDeleteButton = button;
            const dialog = document.getElementById('report-delete-dialog');
            const reason = document.getElementById('report-delete-reason');
            document.getElementById('report-delete-error').textContent = '';
            reason.value = 'Not relevant';
            dialog.showModal();
            reason.focus();
            reason.select();
        }
        function closeReportDeleteDialog() {
            document.getElementById('report-delete-dialog').close();
            reportDeleteButton = null;
        }
        async function confirmReportRowDeletion() {
            if (!reportDeleteButton) return;
            const reason = document.getElementById('report-delete-reason').value.trim();
            const error = document.getElementById('report-delete-error');
            if (!reason) { error.textContent = 'Reason is required'; document.getElementById('report-delete-reason').focus(); return; }
            const confirm = document.getElementById('report-delete-confirm');
            confirm.disabled = true;
            const token=document.querySelector('meta[name="_csrf"]'), header=document.querySelector('meta[name="_csrf_header"]');
            const headers={'Content-Type':'application/json'}; if(token&&header) headers[header.content]=token.content;
            try {
                const response=await fetch(`/api/stoppages/${reportDeleteButton.dataset.id}/exclude`,{method:'POST',headers,body:JSON.stringify({reason})});
                if(response.ok) window.location.reload(); else error.textContent = 'Delete failed';
            } finally {
                confirm.disabled = false;
            }
        }
        const reportSensorId = /*[[${sensorId}]]*/ 'sensor-1', reportTimeGrouping = /*[[${timeGrouping}]]*/ 'daily';
        const lossTotalsByType = {}; reportRows.forEach(row => lossTotalsByType[row.type] = (lossTotalsByType[row.type] || 0) + Number(row.minutes || 0));
        const compactDate = value => {
            const [year, month, day] = value.split('-');
            return day ? `${day}.${month}` : `${month}.${year}`;
        };
        const compactLabel = label => reportTimeGrouping === 'weekly'
            ? label.split('–').map(compactDate).join('–')
            : compactDate(label);
        const chartOptions = {responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'top'}}, scales:{x:{ticks:{autoSkip:true,maxRotation:0,minRotation:0}},y:{beginAtZero:true}}};
        const blueDataset = (label,data) => ({
            label,
            data,
            backgroundColor:'#3b82f6',
            maxBarThickness:72,
            categoryPercentage:0.72,
            barPercentage:0.82
        });
        new Chart(document.getElementById('lossChart'), {type:'bar',data:{labels:Object.keys(lossTotalsByType),datasets:[blueDataset('Lost minutes by type',Object.values(lossTotalsByType))]},options:chartOptions});
        const sensorFive = reportSensorId === 'sensor-5', cansValues = sensorFive ? reportLossTotals : reportTimeTotals;
        new Chart(document.getElementById('cansChart'), {type:'bar',data:{labels:cansValues.map(value => sensorFive ? value.sensorId : compactLabel(value.label)),datasets:[blueDataset(sensorFive ? 'Lost cans by sensor' : 'Lost cans over time',cansValues.map(value => Number(value.lostCans || 0)))]},options:chartOptions});
    </script>
</div>
