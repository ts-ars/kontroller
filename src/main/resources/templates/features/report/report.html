<div th:fragment="content" class="feature-page report-page ui-page ui-page--report">
    <nav class="report-sensors" aria-label="Sensor">
        <th:block th:each="sensor, iteration : ${sensorOptions}">
            <a th:href="@{/page/report(from=${startDate},to=${endDate},sensorId=${sensor.id.value},source=${sourceFilter},type=${typeFilter},reason=${reasonFilter},author=${authorFilter})}" th:classappend="${sensor.id.value == sensorId} ? 'active'" th:text="${#strings.substringAfter(sensor.id.value, 'sensor-')}">1</a><span th:if="${!iteration.last}" aria-hidden="true"> | </span>
        </th:block>
    </nav>
  <form method="get" class="report-filters ui-filter-bar" id="reportFilterForm">
        <label>From <input type="date" name="from" th:value="${startDate}" /></label>
        <label>To <input type="date" name="to" th:value="${endDate}" /></label>
        <input type="hidden" name="sensorId" th:value="${sensorId}" />
        <button type="submit">Filter</button><button type="submit" formaction="/report/export.xlsx">Export Excel</button>
    </form>
  <div class="report-charts ui-chart-grid">
    <section class="report-chart-card ui-section"><div class="operational-chart-frame ui-chart-frame"><canvas id="productionChart"></canvas></div><strong class="report-chart-total" th:text="|Total production: ${totalProduction}|">Total production: 0</strong></section>
    <section class="report-chart-card ui-section"><div class="operational-chart-frame ui-chart-frame"><canvas id="unexplainedChart"></canvas></div><strong id="unexplainedTotal" class="report-chart-total"></strong></section>
    <section class="report-chart-card ui-section"><div class="operational-chart-frame ui-chart-frame"><canvas id="lossChart"></canvas></div><strong id="lossMinutesTotal" class="report-chart-total"></strong></section>
    <section class="report-chart-card ui-section"><div class="operational-chart-frame ui-chart-frame"><canvas id="cansChart"></canvas></div><strong id="lostCansTotal" class="report-chart-total"></strong></section>
    </div>

  <div class="report-table-wrap"><table th:class="'report-table ui-table ui-table--cards ui-table--report ' + (${sensorId == 'sensor-5'} ? 'report-table--with-source ' : 'report-table--without-source ') + (${canExclude} ? 'report-table--with-actions' : 'report-table--without-actions')">
        <colgroup><col th:if="${sensorId == 'sensor-5'}" class="report-source-column" /><col class="report-type-column" /><col class="report-number-column" /><col class="report-number-column" /><col class="report-reason-column" /><col class="report-author-column" /><col th:if="${canExclude}" class="report-actions-column" /></colgroup>
        <thead><tr>
            <th th:if="${sensorId == 'sensor-5'}" class="report-filter-heading"><details><summary>Source<span class="report-filter-icon" aria-hidden="true">⌄</span></summary><div class="report-column-filter"><select name="source" form="reportFilterForm"><option value="">All</option><option th:each="source : ${sourceOptions}" th:value="${source}" th:text="${source}" th:selected="${source == sourceFilter}"></option></select><div><button type="button" class="report-filter-clear">Clear</button><button type="submit" form="reportFilterForm">Apply</button></div></div></details></th>
            <th class="report-filter-heading"><details><summary>Type<span class="report-filter-icon" aria-hidden="true">⌄</span></summary><div class="report-column-filter"><select name="type" form="reportFilterForm"><option value="">All</option><option th:each="type : ${typeOptions}" th:value="${type}" th:text="${type}" th:selected="${type.name() == typeFilter}"></option></select><div><button type="button" class="report-filter-clear">Clear</button><button type="submit" form="reportFilterForm">Apply</button></div></div></details></th>
            <th>Minutes</th><th>Cans</th>
            <th class="report-filter-heading"><details><summary>Reason<span class="report-filter-icon" aria-hidden="true">⌄</span></summary><div class="report-column-filter report-text-filter"><input type="search" name="reason" form="reportFilterForm" th:value="${reasonFilter}" placeholder="Search reason…"><div><button type="button" class="report-filter-clear">Clear</button><button type="submit" form="reportFilterForm">Apply</button></div></div></details></th>
            <th class="report-filter-heading"><details><summary>Author<span class="report-filter-icon" aria-hidden="true">⌄</span></summary><div class="report-column-filter report-text-filter"><input type="search" name="author" form="reportFilterForm" th:value="${authorFilter}" placeholder="Search author…"><div><button type="button" class="report-filter-clear">Clear</button><button type="submit" form="reportFilterForm">Apply</button></div></div></details></th>
            <th th:if="${canExclude}">Actions</th>
        </tr></thead>
        <tbody>
        <tr th:each="problem : ${problems}"><td th:if="${sensorId == 'sensor-5'}" th:text="${problem.source}"></td><td th:text="${problem.type}"></td><td th:text="${problem.minutes}"></td><td th:text="${problem.cans}"></td><td class="report-reason" th:text="${problem.reason}"></td><td class="report-author" th:text="${problem.author}"></td><td th:if="${canExclude}"><button th:if="${problem.stoppageId != null}" type="button" th:attr="data-id=${problem.stoppageId}" onclick="excludeReportRow(this)">Delete</button></td></tr>
        <tr th:if="${problems.isEmpty()}"><td th:colspan="${(sensorId == 'sensor-5' ? 6 : 5) + (canExclude ? 1 : 0)}" class="report-empty">No data for selected range</td></tr>
        </tbody>
        <tfoot><tr><th th:if="${sensorId == 'sensor-5'}"></th><th class="report-total-label">Total</th><th class="report-total-minutes" th:text="${totalMinutes}"></th><th class="report-total-cans" th:text="${totalCans}"></th><th></th><th></th><th th:if="${canExclude}"></th></tr></tfoot>
    </table></div>
    <dialog id="report-delete-dialog" class="report-delete-dialog" aria-labelledby="report-delete-title">
        <h2 id="report-delete-title">Delete report row?</h2>
        <p>Enter a reason before deleting this row.</p>
        <label>Reason for deletion <input id="report-delete-reason" type="text" value="Not relevant" autocomplete="off" /></label>
        <div id="report-delete-error" class="report-delete-error" aria-live="polite"></div>
    <div class="report-delete-actions ui-actions"><button type="button" onclick="closeReportDeleteDialog()">Cancel</button><button id="report-delete-confirm" type="button" onclick="confirmReportRowDeletion()">Delete</button></div>
    </dialog>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="/js/operational-charts.js"></script>
    <script th:inline="javascript">
        const reportRows = /*[[${problems}]]*/ [], reportLossTotals = /*[[${lossTotals}]]*/ [], reportTimeTotals = /*[[${timeTotals}]]*/ [];
        const productionTotals = /*[[${productionTotals}]]*/ [], unexplainedPlanTotals = /*[[${unexplainedPlanTotals}]]*/ [];
        let reportDeleteButton = null;
        function excludeReportRow(button) {
            reportDeleteButton = button;
            const dialog = document.getElementById('report-delete-dialog');
            const reason = document.getElementById('report-delete-reason');
            document.getElementById('report-delete-error').textContent = '';
            reason.value = 'Not relevant';
            dialog.showModal();
            reason.focus();
            reason.select();
        }
        function closeReportDeleteDialog() {
            document.getElementById('report-delete-dialog').close();
            reportDeleteButton = null;
        }
        async function confirmReportRowDeletion() {
            if (!reportDeleteButton) return;
            const reason = document.getElementById('report-delete-reason').value.trim();
            const error = document.getElementById('report-delete-error');
            if (!reason) { error.textContent = 'Reason is required'; document.getElementById('report-delete-reason').focus(); return; }
            const confirm = document.getElementById('report-delete-confirm');
            confirm.disabled = true;
            const token=document.querySelector('meta[name="_csrf"]'), header=document.querySelector('meta[name="_csrf_header"]');
            const headers={'Content-Type':'application/json'}; if(token&&header) headers[header.content]=token.content;
            try {
                const response=await fetch(`/api/stoppages/${reportDeleteButton.dataset.id}/exclude`,{method:'POST',headers,body:JSON.stringify({reason})});
                if(response.ok) window.location.reload(); else error.textContent = 'Delete failed';
            } finally {
                confirm.disabled = false;
            }
        }
        const reportSensorId = /*[[${sensorId}]]*/ 'sensor-1';
        const lossTotalsByType = {}; reportRows.forEach(row => lossTotalsByType[row.type] = (lossTotalsByType[row.type] || 0) + Number(row.minutes || 0));
        const lossTypeLabels = Object.keys(lossTotalsByType), lossTypeValues = Object.values(lossTotalsByType);
        const sumValues = values => values.reduce((sum, value) => sum + Number(value || 0), 0);
        const productionValues = productionTotals.map(value=>Number(value.value||0));
        OperationalCharts.create(document.getElementById('productionChart'), 'production', productionTotals.map(value=>value.label), productionValues);
        OperationalCharts.create(document.getElementById('lossChart'), 'lossTypes', lossTypeLabels, lossTypeValues);
        document.getElementById('lossMinutesTotal').textContent = `Total lost minutes: ${sumValues(lossTypeValues).toLocaleString()}`;
        const sensorFive = reportSensorId === 'sensor-5', cansValues = sensorFive ? reportLossTotals : reportTimeTotals;
        const lostCansValues = cansValues.map(value => Number(value.lostCans || 0));
        OperationalCharts.create(document.getElementById('cansChart'), sensorFive ? 'lossSensors' : 'lossTime', cansValues.map(value => sensorFive ? value.sensorId : value.label), lostCansValues);
        document.getElementById('lostCansTotal').textContent = `Total lost cans: ${sumValues(lostCansValues).toLocaleString()}`;
        const unexplainedValues = unexplainedPlanTotals.map(value=>Number(value.value||0));
        OperationalCharts.create(document.getElementById('unexplainedChart'), 'unexplained', unexplainedPlanTotals.map(value=>value.label), unexplainedValues);
        document.getElementById('unexplainedTotal').textContent = `Total unexplained plan difference: ${sumValues(unexplainedValues).toLocaleString()}`;
        document.querySelectorAll('.report-filter-heading details').forEach(details => details.addEventListener('toggle', () => { if (!details.open) return; document.querySelectorAll('.report-filter-heading details[open]').forEach(other => { if (other !== details) other.open = false; }); }));
        document.querySelectorAll('.report-filter-clear').forEach(button => button.addEventListener('click', () => { const field = button.closest('.report-column-filter').querySelector('input,select'); field.value = ''; document.getElementById('reportFilterForm').requestSubmit(); }));
    </script>
</div>
