<div th:fragment="content" th:attr="data-shift-id=${shiftId}">
  <script th:inline="javascript">
    window.model = window.model || {};
    // сюда Thymeleaf подставит число, если shiftId есть в модели
    window.model.shiftId = /*[[${shiftId}]]*/ null;
    (function guardSaveBtn(){
      const btn = document.getElementById("saveBtn");
      const id =
              (window.model && window.model.shiftId) ??
              document.querySelector("[data-shift-id]")?.getAttribute("data-shift-id") ??
              new URLSearchParams(location.search).get("shiftId");
      if (!id || !/^\d+$/.test(String(id))) {
        btn.disabled = true;
        const box = document.getElementById("save-status");
        box.textContent = "⚠️ Shift ID is missing on page";
        box.style.color = "red";
      }
    })();

  </script>

  <h1>Reasons for Stoppages</h1>

  <!-- 🔴 Предупреждения -->
  <div th:each="alert : ${alerts}">
    <p style="color: red;" th:text="${alert}"></p>
  </div>

  <!-- 📋 Таблица -->
  <table style="border-collapse: collapse; margin-top: 1em; width: 100%;">
    <thead>
    <tr>
      <th style="padding: 8px; border: 1px solid #ccc;">Time</th>
      <th style="padding: 8px; border: 1px solid #ccc;">Min</th>
      <th style="padding: 8px; border: 1px solid #ccc;">Cans</th>
      <th style="padding: 8px; border: 1px solid #ccc;">Type</th>
      <th style="padding: 8px; border: 1px solid #ccc;">Comment</th>
    </tr>
    </thead>
    <tbody id="stoppage-body">
    <tr th:each="row : ${rows}">
      <td style="border: 1px solid #ccc; padding: 6px;" th:text="${row.time}">08:00</td>
      <td style="border: 1px solid #ccc; padding: 6px;">
        <input type="text" th:value="${row.minutes}"
               th:readonly="${!row.editable}"
               style="width: 80px;" />
      </td>
      <td style="border: 1px solid #ccc; padding: 6px;">
        <input type="text" class="cans" th:value="${row.cans}" style="width: 80px;" readonly />
      </td>
      <td style="border: 1px solid #ccc; padding: 6px;">
        <select th:value="${row.type}" style="width: 120px;">
          <option value="">–</option>
          <option value="organization">organization</option>
          <option value="breakdown">breakdown</option>
          <option value="material">material</option>
          <option value="quality">quality</option>
        </select>
      </td>
      <td style="border: 1px solid #ccc; padding: 6px;">
        <input type="text" th:value="${row.comment}" style="width: 220px;" />
      </td>
      <td style="display: none;">
        <input type="hidden" th:value="${row.hourIndex}" />
      </td>
    </tr>
    </tbody>
  </table>

  <!-- ➕ Кнопка добавления строки -->
  <button type="button"
          style="margin-top: 16px; padding: 6px 12px; background: #2563eb; color: white; border: none; border-radius: 4px;"
          onclick="addReason()">Add Reason
  </button>

  <!-- 💾 Кнопка сохранения -->
  <button id="saveBtn" type="button"
          style="margin-top: 16px; margin-left: 12px; padding: 6px 12px; background: green; color: white; border: none; border-radius: 4px;"
          onclick="submitData()">Save to Database
  </button>

  <div id="save-status" style="margin-top: 10px; font-weight: bold;"></div>

  <!-- ⚙️ Скрипты -->
  <script>
    function addReason() {
      const tbody = document.getElementById("stoppage-body");
      const tr = document.createElement("tr");
      tr.innerHTML = `
    <td style="border:1px solid #ccc; padding:6px;">—</td>
    <td style="border:1px solid #ccc; padding:6px;">
      <input type="text" value="" style="width:80px;" />
    </td>
    <td style="border:1px solid #ccc; padding:6px;">
      <input type="text" class="cans" value="0" style="width:80px;" readonly />
    </td>
    <td style="border:1px solid #ccc; padding:6px;">
      <select style="width:120px;">
        <option value="">–</option>
        <option value="organization">organization</option>
        <option value="breakdown">breakdown</option>
        <option value="material">material</option>
        <option value="quality">quality</option>
      </select>
    </td>
    <td style="border:1px solid #ccc; padding:6px;">
      <input type="text" value="" style="width:220px;" />
    </td>
    <td style="display:none;">
      <input type="hidden" value="" />
    </td>
  `;
      tbody.appendChild(tr);
    }

    function submitData() {
      const rows = document.querySelectorAll("#stoppage-body tr");
      const data = Array.from(rows).map(row => {
        const inputs = row.querySelectorAll("input, select");
        return {
          hourIndex: Number.parseInt(inputs[5]?.value),
          minutes: Number.parseFloat(inputs[1]?.value),
          cans: Number.parseInt(inputs[2]?.value),
          type: inputs[3]?.value,
          comment: inputs[4]?.value,
          time: row.querySelector("td:first-child")?.textContent?.trim()
        };
      });

      const statusBox = document.getElementById("save-status");

      const shiftIdRaw =
              (window.model && window.model.shiftId) ??
              document.querySelector("[data-shift-id]")?.getAttribute("data-shift-id") ??
              new URLSearchParams(location.search).get("shiftId");

      if (!shiftIdRaw || !/^\d+$/.test(String(shiftIdRaw))) {
        statusBox.textContent = "❌ Shift ID is missing on page";
        statusBox.style.color = "red";
        return;
      }

      const shiftId = Number(shiftIdRaw);

      fetch(`/api/shifts/${shiftId}/comments`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
      })
              .then(res => {
                if (res.ok) {
                  statusBox.textContent = "✅ Saved to database";
                  statusBox.style.color = "green";
                } else {
                  statusBox.textContent = "❌ Failed to save";
                  statusBox.style.color = "red";
                }
                setTimeout(() => { statusBox.textContent = ""; }, 3000);
              })
              .catch(err => {
                console.error(err);
                statusBox.textContent = "❌ Network error";
                statusBox.style.color = "red";
                setTimeout(() => { statusBox.textContent = ""; }, 3000);
              });
    }
  </script>
</div>
