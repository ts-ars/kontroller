<div th:fragment="content">
  <h1>Loss explanations</h1>

  <div th:each="alert : ${alerts}">
    <p class="loss-alert" th:text="${alert}"></p>
  </div>

  <div th:if="${#lists.isEmpty(losses)}">No system losses for today.</div>

  <section class="loss-card" th:each="loss : ${losses}" th:attr="data-stoppage-id=${loss.id}">
    <h2 th:text="|${loss.detectionType} · ${loss.time}|">FIXED · 08:00</h2>
    <p>
      <span th:text="|Loss: ${loss.roundedMinutes} min / ${loss.lostCans} cans|">Loss</span>
      · <span class="allocation-summary"
              th:text="|Allocated: ${loss.allocatedMinutes} min; remaining: ${loss.remainingMinutes} min|">Allocation</span>
    </p>

    <table>
      <thead><tr><th>Category</th><th>Comment</th><th>Minutes</th><th>Allocated cans</th><th>Actions</th></tr></thead>
      <tbody class="explanations">
      <tr th:each="explanation : ${loss.explanations}" th:attr="data-explanation-id=${explanation.id}">
        <td><select class="category">
          <option th:each="category : ${T(com.exempal.shiftcounter.features.comment.domain.LossCategory).values()}"
                  th:value="${category}" th:text="${category}"
                  th:selected="${category == explanation.category}"></option>
        </select></td>
        <td><input class="comment" type="text" th:value="${explanation.comment}" /></td>
        <td><input class="allocated-minutes" type="number" min="0" step="1"
                   th:value="${explanation.allocatedMinutes}" /></td>
        <td class="allocated-cans" th:text="${explanation.allocatedCans}">0</td>
        <td><button type="button" onclick="saveExplanation(this)">Save</button>
          <button type="button" onclick="deleteExplanation(this)">Delete</button></td>
      </tr>
      </tbody>
    </table>
    <button type="button" onclick="addExplanation(this)">Add reason</button>
    <div class="save-status"></div>
  </section>

  <script>
    const categories = ['ORGANIZATION', 'BREAKDOWN', 'MATERIAL', 'QUALITY'];

    function addExplanation(button) {
      const card = button.closest('.loss-card');
      const row = document.createElement('tr');
      row.innerHTML = `<td><select class="category">${categories.map(c => `<option>${c}</option>`).join('')}</select></td>
        <td><input class="comment" type="text"></td>
        <td><input class="allocated-minutes" type="number" min="0" step="1" value="0"></td>
        <td class="allocated-cans">0</td>
        <td><button type="button" onclick="saveExplanation(this)">Save</button>
        <button type="button" onclick="deleteExplanation(this)">Delete</button></td>`;
      card.querySelector('.explanations').appendChild(row);
    }

    async function saveExplanation(button) {
      const row = button.closest('tr');
      const card = button.closest('.loss-card');
      const stoppageId = card.dataset.stoppageId;
      const explanationId = row.dataset.explanationId;
      const payload = {
        category: row.querySelector('.category').value,
        comment: row.querySelector('.comment').value,
        allocatedMinutes: Number(row.querySelector('.allocated-minutes').value)
      };
      const url = `/api/stoppages/${stoppageId}/explanations${explanationId ? `/${explanationId}` : ''}`;
      const response = await fetch(url, {
        method: explanationId ? 'PUT' : 'POST',
        headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
      });
      if (!response.ok) return showStatus(card, await errorText(response), true);
      const saved = await response.json();
      row.dataset.explanationId = saved.id;
      row.querySelector('.allocated-cans').textContent = saved.allocatedCans;
      showStatus(card, 'Saved', false);
      window.location.reload();
    }

    async function deleteExplanation(button) {
      const row = button.closest('tr');
      const card = button.closest('.loss-card');
      if (!row.dataset.explanationId) return row.remove();
      const response = await fetch(`/api/stoppages/${card.dataset.stoppageId}/explanations/${row.dataset.explanationId}`,
              {method: 'DELETE'});
      if (!response.ok) return showStatus(card, await errorText(response), true);
      window.location.reload();
    }

    async function errorText(response) {
      try { return (await response.json()).detail || 'Request failed'; } catch (_) { return 'Request failed'; }
    }

    function showStatus(card, text, error) {
      const status = card.querySelector('.save-status');
      status.textContent = text;
      status.style.color = error ? 'red' : 'green';
    }
  </script>
</div>
