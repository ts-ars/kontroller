version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: shift-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: shiftcounter
      POSTGRES_USER: shift
      POSTGRES_PASSWORD: shift
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
