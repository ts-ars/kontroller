services:
  postgres-prod:
    image: postgres:15
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${SHIFT_DB_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${SHIFT_PROD_DB_ADMIN_PASSWORD:?set SHIFT_PROD_DB_ADMIN_PASSWORD}
      APP_DB: shiftcounter_prod
      APP_USER: shift_prod
      APP_PASSWORD: ${SHIFT_PROD_DB_PASSWORD:?set SHIFT_PROD_DB_PASSWORD}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
      - ./docker/postgres/init-app-database.sh:/docker-entrypoint-initdb.d/10-init-app-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-test:
    image: postgres:15
    profiles: ["test"]
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${SHIFT_DB_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${SHIFT_TEST_DB_ADMIN_PASSWORD:?set SHIFT_TEST_DB_ADMIN_PASSWORD}
      APP_DB: shiftcounter_test
      APP_USER: shift_test
      APP_PASSWORD: ${SHIFT_TEST_DB_PASSWORD:?set SHIFT_TEST_DB_PASSWORD}
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./docker/postgres/init-app-database.sh:/docker-entrypoint-initdb.d/10-init-app-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-prod-data:
  postgres-test-data:
