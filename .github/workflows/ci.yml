name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: kontroller-ci
      POSTGRES_PORT: "55432"
      POSTGRES_SUPERUSER_PASSWORD: ci_admin_password
      SHIFT_PROD_DB_PASSWORD: ci_prod_password
      SHIFT_TEST_DB_PASSWORD: ci_test_password
      TEST_DB_URL: jdbc:postgresql://localhost:55432/shiftcounter_test
      TEST_DB_USERNAME: shift_test
      TEST_DB_PASSWORD: ci_test_password
      PROD_DB_URL: jdbc:postgresql://localhost:55432/shiftcounter_prod
      PROD_DB_USERNAME: shift_prod
      PROD_DB_PASSWORD: ci_prod_password

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Start isolated PostgreSQL
        run: |
          docker compose up -d
          for attempt in {1..60}; do
            if docker compose exec -T postgres pg_isready -U postgres -d shiftcounter_test; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgres
          exit 1

      - name: Run verification suite
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Run release load suite
        run: ./mvnw --batch-mode --no-transfer-progress -Dgroups=load -DexcludedGroups=e2e test

      - name: Package immutable release candidate
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests -Drevision=0.0.${{ github.run_number }} -Dgit.commit=${{ github.sha }} clean package

      - name: Upload release candidate
        uses: actions/upload-artifact@v6
        with:
          name: shiftcounter-${{ github.sha }}
          path: target/shiftcounter-0.0.${{ github.run_number }}.jar
          if-no-files-found: error
          retention-days: 14

      - name: Stop isolated PostgreSQL
        if: always()
        run: docker compose down --volumes
